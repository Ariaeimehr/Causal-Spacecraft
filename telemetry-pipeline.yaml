# ==============================================================================
# Causal-Spacecraft: Ground Station Cloud-Native Streaming Telemetry Pipeline
# Kubernetes Manifests: High-Availability Deployment, HPA, and Service Topology
# ==============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: aerospace-ground-segment
  labels:
    mission.nasa.gov/tier: ground-data-system
    app.kubernetes.io/part-of: causal-spacecraft
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: causal-spacecraft-config
  namespace: aerospace-ground-segment
  labels:
    app: causal-spacecraft
data:
  SEQ_LEN: "64"
  ANOMALY_THRESHOLD: "2.2"
  MODEL_DEVICE: "cpu"
  LOG_LEVEL: "INFO"
  KAFKA_TELEMETRY_TOPIC: "spacecraft.flight-ops.raw-telemetry"
  KAFKA_ANOMALY_ALERTS_TOPIC: "spacecraft.flight-ops.causal-anomalies"
  MAX_INFERENCE_BATCH: "64"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: causal-spacecraft-sa
  namespace: aerospace-ground-segment
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: causal-spacecraft-inference
  namespace: aerospace-ground-segment
  labels:
    app: causal-spacecraft
    component: inference-engine
    tier: mission-critical
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: causal-spacecraft
      component: inference-engine
  template:
    metadata:
      labels:
        app: causal-spacecraft
        component: inference-engine
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: causal-spacecraft-sa
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - causal-spacecraft
                topologyKey: "kubernetes.io/hostname"
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: causal-transformer-engine
          image: ghcr.io/aerospace-ai/causal-spacecraft:v1.2.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: causal-spacecraft-config
          ports:
            - name: http-api
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "4000m"
              memory: "6Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: http-api
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http-api
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: causal-spacecraft-svc
  namespace: aerospace-ground-segment
  labels:
    app: causal-spacecraft
spec:
  type: ClusterIP
  selector:
    app: causal-spacecraft
    component: inference-engine
  ports:
    - name: http-telemetry
      port: 80
      targetPort: 8000
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: causal-spacecraft-hpa
  namespace: aerospace-ground-segment
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: causal-spacecraft-inference
  minReplicas: 3
  maxReplicas: 16
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Percent
          value: 20
          periodSeconds: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: causal-spacecraft-pdb
  namespace: aerospace-ground-segment
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: causal-spacecraft
      component: inference-engine
